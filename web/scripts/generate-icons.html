<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>生成 PWA 图标</title></head>
<body style="font-family: sans-serif; padding: 40px;">
  <h2>PWA 图标生成器</h2>
  <p>点击按钮生成两个尺寸的图标，保存到 <code>public/icons/</code> 目录</p>
  <canvas id="c192" width="192" height="192" style="display:none"></canvas>
  <canvas id="c512" width="512" height="512" style="display:none"></canvas>
  <p id="status"></p>
  <button onclick="generate()">生成并下载图标</button>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      // Gradient background
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#FF6B6B');
      grad.addColorStop(0.55, '#E4393C');
      grad.addColorStop(1, '#B9272B');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.22);
      ctx.fill();

      // 叶子（矢量绘制，与 favicon.svg 一致）
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(size * 0.5, size * 0.18);
      ctx.bezierCurveTo(size * 0.65, size * 0.29, size * 0.74, size * 0.46, size * 0.74, size * 0.65);
      ctx.bezierCurveTo(size * 0.74, size * 0.78, size * 0.68, size * 0.84, size * 0.5, size * 0.84);
      ctx.bezierCurveTo(size * 0.32, size * 0.84, size * 0.26, size * 0.78, size * 0.26, size * 0.65);
      ctx.bezierCurveTo(size * 0.26, size * 0.46, size * 0.35, size * 0.29, size * 0.5, size * 0.18);
      ctx.fill();

      // 叶脉
      ctx.strokeStyle = 'rgba(228,57,60,.35)';
      ctx.lineWidth = size * 0.025;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(size * 0.5, size * 0.23);
      ctx.lineTo(size * 0.5, size * 0.81);
      ctx.stroke();
    }

    function download(canvas, filename) {
      canvas.toBlob(b => {
        const url = URL.createObjectURL(b);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }, 'image/png');
    }

    function generate() {
      drawIcon(document.getElementById('c192'), 192);
      drawIcon(document.getElementById('c512'), 512);
      setTimeout(() => {
        download(document.getElementById('c192'), 'icon-192.png');
        setTimeout(() => {
          download(document.getElementById('c512'), 'icon-512.png');
          document.getElementById('status').textContent = '✅ 已下载两个图标文件，请放入 public/icons/ 目录';
        }, 300);
      }, 100);
    }
  </script>
</body></html>
